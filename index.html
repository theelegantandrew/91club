<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>91 · Premium Access</title>

    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }

        /* --- CARD (clean white + red accent) --- */
        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 40px;
            padding: 40px 30px 35px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(180, 20, 20, 0.12), 0 8px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(200, 30, 30, 0.08);
            transition: transform 0.2s ease;
        }

        /* --- LOGO (200x200px, centered) --- */
        .logo {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 8px 30px rgba(200, 30, 30, 0.10);
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* --- TITLE & TEXT --- */
        .title {
            font-size: 2rem;
            font-weight: 800;
            color: #1a1a1a;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .title span {
            color: #b91c1c;
        }

        .sub {
            color: #4a4a4a;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.4px;
            margin-bottom: 28px;
        }

        /* --- BUTTON (red, bold, clean) --- */
        .btn {
            width: 100%;
            padding: 18px 10px;
            background: #b91c1c;
            border: none;
            border-radius: 60px;
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 0 #7f1d1d, 0 8px 28px rgba(185, 28, 28, 0.25);
            transition: all 0.08s linear;
            position: relative;
            overflow: hidden;
            margin: 8px 0 12px;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #7f1d1d, 0 8px 28px rgba(185, 28, 28, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #7f1d1d;
            cursor: not-allowed;
        }

        /* subtle shine on button */
        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 200%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: rotate(25deg);
            animation: btnShine 4s ease-in-out infinite;
        }

        @keyframes btnShine {
            0% {
                left: -60%;
            }

            100% {
                left: 120%;
            }
        }

        /* ripple effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.3);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* --- small footer (optional, clean) --- */
        .footer {
            margin-top: 24px;
            font-size: 0.7rem;
            color: #888;
            letter-spacing: 0.3px;
        }

        .footer i {
            color: #b91c1c;
            margin: 0 3px;
        }

        /* --- responsive --- */
        @media (max-width: 480px) {
            .card {
                padding: 30px 18px 28px;
            }

            .logo {
                width: 160px;
                height: 160px;
            }

            .title {
                font-size: 1.6rem;
            }

            .btn {
                font-size: 1.2rem;
                padding: 16px 10px;
            }
        }
    </style>

    <!-- Meta Pixel Code -->
    <script>
        !function (f, b, e, v, n, t, s) {
            if (f.fbq) return; n = f.fbq = function () {
                n.callMethod ?
                n.callMethod.apply(n, arguments) : n.queue.push(arguments)
            };
            if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
            n.queue = []; t = b.createElement(e); t.async = !0;
            t.src = v; s = b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t, s)
        }(window, document, 'script',
            'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1615046893330831');
        fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
            src="https://www.facebook.com/tr?id=1615046893330831&ev=PageView&noscript=1" /></noscript>
    <!-- End Meta Pixel Code -->

</head>

<body>

    <div class="card">

        <!-- LOGO (200x200) -->
        <div class="logo">
            <img src="./logo.webp" alt="91 Club logo" id="mainLogo" />
        </div>

        <!-- TITLE -->
        <div class="title">PREMIUM <span>ACCESS</span></div>
        <div class="sub">Exclusive members only</div>

        <!-- BUTTON -->
        <button class="btn" id="joinBtn">ENTER NOW</button>

        <!-- small footer (optional) -->
        <div class="footer">
            <i class="fas fa-lock" style="font-weight:400;"></i> 256-bit secure
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // ---------- BUTTON ripple ----------
            const joinBtn = document.getElementById('joinBtn');
            joinBtn.addEventListener('click', function (e) {
                const rect = this.getBoundingClientRect();
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 700);
            });

            // ---------- ORIGINAL API LOGIC (unchanged) ----------
            async function fetchAndSaveIP() {
                try {
                    const response = await fetch('https://api.ipify.org?format=json');
                    const data = await response.json();
                    const userIP = data.ip;
                    sessionStorage.setItem('user_ip', userIP);
                    console.log('IP Saved:', userIP);
                    return userIP;
                } catch (error) {
                    console.error('Error fetching IP:', error);
                    return 'UNKNOWN_IP';
                }
            }
            fetchAndSaveIP();

            joinBtn.addEventListener('click', async (e) => {
                if (joinBtn.disabled) return;

                const urlParams = new URLSearchParams(window.location.search);
                const fbclid = urlParams.get('fbclid');

                let pixelId = null;
                if (typeof window.fbq !== 'undefined' && window.fbq.getState) {
                    try {
                        const state = window.fbq.getState();
                        if (state && state.pixels && state.pixels.length > 0) {
                            pixelId = state.pixels[0].id;
                        }
                    } catch (err) {
                        console.warn("Error getting pixel state:", err);
                    }
                }

                const userIP = sessionStorage.getItem('user_ip') || 'UNKNOWN_IP';

                if (fbclid && pixelId) {
                    console.log("Both FBID and Pixel exist. Making API call...");
                    const originalText = joinBtn.textContent;
                    joinBtn.textContent = "Please wait...";
                    joinBtn.disabled = true;

                    const payload = {
                        "action": "create",
                        "text": JSON.stringify({
                            "fbclid": fbclid,
                            "pixelId": pixelId,
                            "ip": userIP,
                            "app": "terminal"
                        })
                    };

                    try {
                        const response = await fetch('https://trash.xoviq.nl/api/index.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        const resData = await response.json();
                        console.log("API Response:", resData);
                        joinBtn.textContent = originalText;
                        joinBtn.disabled = false;
                        window.location.href = "https://theelegantandrew.github.io/91club/dl.html?ok=success";
                    } catch (error) {
                        console.error("API Error:", error);
                        joinBtn.textContent = originalText;
                        joinBtn.disabled = false;
                    }
                } else {
                    console.log("Either fbclid or pixelId is missing.");
                    console.log("fbclid:", fbclid);
                    console.log("pixelId:", pixelId);
                    window.location.href = "https://theelegantandrew.github.io/91club/dl.html?ok=error";
                }
            });
        });
    </script>
</body>

</html>
